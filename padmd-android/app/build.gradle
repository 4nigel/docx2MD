plugins { id 'com.android.application' }

android {
    namespace 'nz.padmd'
    compileSdk 34
    defaultConfig {
        applicationId 'nz.padmd'
        minSdk 21
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName '1.0.' + (System.getenv('VERSION_CODE') ?: '1')
    }
    signingConfigs {
        release {
            def ks = System.getenv('PADMD_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('PADMD_KEYSTORE_PASSWORD')
                keyAlias System.getenv('PADMD_KEY_ALIAS') ?: 'padmd'
                keyPassword System.getenv('PADMD_KEYSTORE_PASSWORD')
            }
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('PADMD_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
