<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<title>padMD</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#191b1d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Lightweight Markdown creator, editor and viewer for touch tablets. Works offline.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23191b1d'/%3E%3Crect x='8' y='8' width='48' height='48' rx='6' fill='none' stroke='%23e8a020' stroke-width='4'/%3E%3Ctext x='32' y='42' font-family='Arial' font-weight='700' font-size='22' fill='%23e8a020' text-anchor='middle'%3EMD%3C/text%3E%3C/svg%3E">
<style>
/* ── Colour tokens (dark is the default, light follows the tablet setting or the toggle) ── */
:root{
  --bg:#191b1d;--surface:#212426;--surface2:#292c2f;--border:#333639;--border2:#44484c;
  --accent:#e8a020;--accent-lo:rgba(232,160,32,.14);--text:#d8dadc;--text-dim:#8a8f95;--text-lo:#5a5e63;
  --ok:#4caf82;--warn:#d97c3a;--code-bg:#15171a;--mark:rgba(232,160,32,.35);
  --mono:ui-monospace,"Roboto Mono","Droid Sans Mono","SamsungOneUI",Menlo,Consolas,monospace;
  --sans:"Samsung Sans","SamsungOne",Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Noto Serif",Georgia,"Times New Roman",serif;
  --fs:17px;--tap:44px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f6f5f2;--surface:#ffffff;--surface2:#efeee9;--border:#dddbd5;--border2:#c7c4bc;
  --accent:#b36f00;--accent-lo:rgba(179,111,0,.10);--text:#22252a;--text-dim:#5f646b;--text-lo:#9a9ea4;
  --ok:#2e8a5c;--warn:#b5561a;--code-bg:#f0eee8;--mark:rgba(240,184,64,.45);
  color-scheme:light;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]):not([data-theme="light"]){
    --bg:#f6f5f2;--surface:#ffffff;--surface2:#efeee9;--border:#dddbd5;--border2:#c7c4bc;
    --accent:#b36f00;--accent-lo:rgba(179,111,0,.10);--text:#22252a;--text-dim:#5f646b;--text-lo:#9a9ea4;
    --ok:#2e8a5c;--warn:#b5561a;--code-bg:#f0eee8;--mark:rgba(240,184,64,.45);
    color-scheme:light;
  }
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans);font-size:15px;background:var(--bg);color:var(--text);
  display:flex;flex-direction:column;height:100%;height:100dvh;overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation}
svg{display:block}

/* ── Header ── */
header{
  display:flex;align-items:center;padding:0 8px;min-height:56px;
  background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;
}
.hbtn,.seg{margin-left:4px}
.logo{width:34px;height:34px;border:2px solid var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:12px;color:var(--accent);letter-spacing:.02em;flex-shrink:0;margin:0 4px}
.docname{display:flex;align-items:center;gap:6px;min-width:0;flex:1;padding:6px 8px;border-radius:8px}
.docname:active{background:var(--surface2)}
.docname span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:15px}
.dirty{width:9px;height:9px;border-radius:50%;background:var(--accent);flex-shrink:0;visibility:hidden}
.dirty.on{visibility:visible}
.hbtn{min-width:var(--tap);height:var(--tap);border-radius:10px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;color:var(--text);font-size:14px;font-weight:500}
.hbtn:active,.hbtn.on{background:var(--accent-lo);color:var(--accent)}
.hbtn .lbl{display:none}
@media (min-width:900px){.hbtn .lbl{display:inline}}
.seg{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:2px;flex-shrink:0}
.seg button{height:38px;padding:0 14px;border-radius:8px;font-size:14px;font-weight:500;color:var(--text-dim)}
.seg button.on{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.seg button.hide{display:none}

/* ── Format bar ── */
.fmtbar{
  display:flex;padding:6px 8px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;
  background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;
}
.fmtbar::-webkit-scrollbar{display:none}
.fmtbar.hide{display:none}
.fmtbar>*{margin-right:4px}
.fb{min-width:var(--tap);height:var(--tap);padding:0 10px;border-radius:9px;background:var(--surface2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-size:15px;white-space:nowrap;flex-shrink:0}
.fb:active{border-color:var(--accent);color:var(--accent);background:var(--accent-lo)}
.fb.mono{font-family:var(--mono);font-size:13px}
.fsep{width:1px;background:var(--border);margin:6px 4px;flex-shrink:0}

/* ── Find bar ── */
.findbar{display:none;gap:6px;padding:6px 8px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center;flex-shrink:0}
.findbar.on{display:flex}
.findbar input{flex:1 1 160px;height:40px;border-radius:9px;border:1px solid var(--border2);background:var(--bg);color:var(--text);padding:0 10px;font-size:15px;min-width:0}
.findbar input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.findbar .cnt{font-size:13px;color:var(--text-dim);min-width:56px;text-align:center}

/* ── Panes ── */
main{flex:1;display:flex;min-height:0;position:relative}
.pane{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.pane.hide{display:none}
#editPane{border-right:1px solid var(--border)}
main.single #editPane{border-right:none}
textarea#src{
  flex:1;width:100%;resize:none;border:none;outline:none;background:var(--bg);color:var(--text);
  font-family:var(--mono);font-size:calc(var(--fs) - 1px);line-height:1.65;padding:18px 20px 40vh;
  tab-size:4;caret-color:var(--accent);
}
body.sansedit textarea#src{font-family:var(--sans);font-size:var(--fs)}
textarea#src::placeholder{color:var(--text-lo)}
#readPane{overflow-y:auto;background:var(--bg);-webkit-overflow-scrolling:touch}
#out{width:100%;position:relative;outline:none;caret-color:var(--accent);min-height:60vh}
#out.isempty::before{content:"Start writing… type # and a space for a heading, - and a space for a list.";color:var(--text-lo);position:absolute;pointer-events:none;left:26px;right:26px}
#out.isempty>*{min-height:1.7em}
#out[contenteditable=true] a{cursor:text}

/* ── Rendered Markdown ── */
.md{max-width:820px;margin:0 auto;padding:22px 26px 30vh;font-size:var(--fs);line-height:1.7;word-wrap:break-word}
body.serif .md{font-family:var(--serif)}
.md>*:first-child{margin-top:0}
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{font-family:var(--sans);line-height:1.3;margin:1.4em 0 .5em;font-weight:650;scroll-margin-top:12px}
.md h1{font-size:1.85em;border-bottom:2px solid var(--accent);padding-bottom:.25em}
.md h2{font-size:1.45em;border-bottom:1px solid var(--border);padding-bottom:.2em}
.md h3{font-size:1.2em}.md h4{font-size:1.05em}.md h5,.md h6{font-size:.95em;color:var(--text-dim)}
.md p,.md ul,.md ol,.md blockquote,.md pre,.md table{margin:0 0 1em}
.md ul,.md ol{padding-left:1.6em}
.md li{margin:.2em 0}
.md li>ul,.md li>ol{margin:.2em 0}
.md li>p{margin:0 0 .4em}
.md li.task{list-style:none;margin-left:-1.4em}
.md li.task>input{width:1.15em;height:1.15em;margin-right:.5em;vertical-align:-.15em;accent-color:var(--accent);cursor:pointer}
.md li.task.done>.tt{color:var(--text-dim);text-decoration:line-through}
.md a{color:var(--accent);text-underline-offset:2px}
.md code{font-family:var(--mono);font-size:.88em;background:var(--code-bg);border:1px solid var(--border);border-radius:5px;padding:.08em .35em}
.md pre{background:var(--code-bg);border:1px solid var(--border);border-radius:8px;padding:14px 16px;overflow-x:auto;line-height:1.5}
.md pre code{background:none;border:none;padding:0;font-size:.85em}
.md blockquote{border-left:4px solid var(--accent);background:var(--accent-lo);padding:.6em 1em;border-radius:0 8px 8px 0;color:var(--text)}
.md blockquote>*:last-child{margin-bottom:0}
.md hr{border:none;border-top:2px solid var(--border);margin:1.8em 0}
.md img{max-width:100%;height:auto;border-radius:6px}
.md mark{background:var(--mark);color:inherit;padding:0 .15em;border-radius:3px}
.md .tblwrap{overflow-x:auto;margin:0 0 1em}
.md table{border-collapse:collapse;min-width:50%;font-size:.93em;margin:0}
.md th,.md td{border:1px solid var(--border2);padding:.45em .75em;vertical-align:top}
.md th{background:var(--surface2);font-family:var(--sans);font-weight:600}
.md tr:nth-child(even) td{background:var(--surface2);background:color-mix(in srgb,var(--surface2) 45%,transparent)}
.empty{color:var(--text-dim);text-align:center;padding:12vh 20px;font-family:var(--sans)}
.empty h2{border:none;color:var(--text);font-size:1.4em;margin-bottom:.5em}
.empty .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:1.4em}
.btnp{height:var(--tap);padding:0 18px;border-radius:10px;border:1px solid var(--accent);color:var(--accent);background:var(--accent-lo);font-weight:600}
.btns{height:var(--tap);padding:0 18px;border-radius:10px;border:1px solid var(--border2);background:var(--surface2);font-weight:500}

/* ── Footer ── */
footer{display:flex;gap:14px;align-items:center;padding:0 14px calc(env(safe-area-inset-bottom));min-height:30px;font-size:12.5px;color:var(--text-dim);
  background:var(--surface);border-top:1px solid var(--border);flex-shrink:0;white-space:nowrap;overflow:hidden}
footer .sp{flex:1}
#status.ok{color:var(--ok)}#status.warn{color:var(--warn)}

/* ── Sheets (menus and dialogs) ── */
.scrim{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.45);display:none;z-index:50}
.scrim.on{display:block}
.sheet{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--border2);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.4);
  display:none;flex-direction:column;max-height:80vh;max-height:80dvh;overflow-y:auto}
.sheet.on{display:flex}
.menu{top:60px;right:8px;width:290px;padding:6px}
.menu button,.toc a{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 14px;border-radius:9px;text-align:left;width:100%;font-size:15px}
.menu button:active,.toc a:active{background:var(--accent-lo);color:var(--accent)}
.menu .msep{height:1px;background:var(--border);margin:6px 8px}
.menu .mrow{display:flex;align-items:center;gap:6px;padding:4px 8px 4px 14px;min-height:46px;font-size:15px}
.menu .mrow span{flex:1}
.menu .mrow .seg button{height:34px;padding:0 10px;font-size:13px}
.toc{top:60px;left:8px;width:min(380px,calc(100vw - 16px));padding:6px}
.toc a{color:var(--text);text-decoration:none;min-height:42px;font-size:14.5px}
.toc a.l1{font-weight:650}.toc a.l3{padding-left:30px;color:var(--text-dim)}.toc a.l4,.toc a.l5,.toc a.l6{padding-left:44px;color:var(--text-dim);font-size:13.5px}
.toc .none{padding:14px;color:var(--text-dim)}
.dlg{left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100vw - 32px));padding:20px;gap:12px}
.dlg h3{font-size:17px}
.dlg p{color:var(--text-dim);font-size:14px;line-height:1.5}
.dlg input{height:46px;border-radius:9px;border:1px solid var(--border2);background:var(--bg);color:var(--text);padding:0 12px;font-size:16px;width:100%}
.dlg .row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.help{width:min(620px,calc(100vw - 32px))}
.help .md{padding:0;font-size:15px;max-width:none}
.help .md p{color:var(--text);font-size:inherit}
.toast{position:fixed;left:50%;bottom:48px;transform:translateX(-50%) translateY(20px);background:var(--surface2);border:1px solid var(--border2);
  color:var(--text);padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:80;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── Print: A4, reading view only ── */
@page{size:A4;margin:18mm 16mm}
@media print{
  :root{--bg:#fff;--surface:#fff;--surface2:#f1f1f1;--border:#ccc;--border2:#bbb;--text:#111;--text-dim:#555;--accent:#8a5500;--accent-lo:#f7efe0;--code-bg:#f5f5f5;color-scheme:light}
  body{height:auto;overflow:visible;display:block;background:#fff}
  header,.fmtbar,.findbar,footer,#editPane,.sheet,.scrim,.toast{display:none!important}
  main{display:block}
  #readPane{display:block!important;overflow:visible}
  .md{padding:0;max-width:none;font-size:11pt}
  .md pre,.md table,.md img,.md blockquote{break-inside:avoid}
  .md h1,.md h2,.md h3{break-after:avoid}
}
</style>
</head>
<body>

<header>
  <div class="logo" aria-hidden="true">MD</div>
  <button class="docname" id="nameBtn" title="Rename"><span id="docName">Untitled.md</span><i class="dirty" id="dirty"></i></button>
  <div class="seg" id="viewSeg" role="tablist" aria-label="Mode">
    <button data-view="wyg" title="Type on the formatted page">WYG</button>
    <button data-view="md" title="Edit the Markdown text">MD</button>
  </div>
  <button class="hbtn" id="tocBtn" title="Contents">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>
    <span class="lbl">Contents</span></button>
  <button class="hbtn" id="openBtn" title="Open a file">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    <span class="lbl">Open</span></button>
  <button class="hbtn" id="saveBtn" title="Save (Ctrl+S)">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 3h11l5 5v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M7 3v6h8V3"/><rect x="7" y="13" width="10" height="8"/></svg>
    <span class="lbl">Save</span></button>
  <button class="hbtn" id="shareBtn" title="Share or send to another app">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"/></svg>
    <span class="lbl">Share</span></button>
  <button class="hbtn" id="menuBtn" title="More">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
</header>

<div class="fmtbar" id="fmtbar">
  <button class="fb" data-a="undo" title="Undo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
  <button class="fb" data-a="redo" title="Redo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
  <div class="fsep"></div>
  <button class="fb" data-a="h1" title="Heading 1"><b>H1</b></button>
  <button class="fb" data-a="h2" title="Heading 2"><b>H2</b></button>
  <button class="fb" data-a="h3" title="Heading 3"><b>H3</b></button>
  <div class="fsep"></div>
  <button class="fb" data-a="bold" title="Bold (Ctrl+B)"><b>B</b></button>
  <button class="fb" data-a="italic" title="Italic (Ctrl+I)"><i style="font-family:var(--serif)">I</i></button>
  <button class="fb" data-a="strike" title="Strikethrough"><s>S</s></button>
  <button class="fb" data-a="mark" title="Highlight"><span style="background:var(--mark);padding:0 4px;border-radius:3px">H</span></button>
  <div class="fsep"></div>
  <button class="fb" data-a="ul" title="Bullet list">• List</button>
  <button class="fb" data-a="ol" title="Numbered list">1. List</button>
  <button class="fb" data-a="task" title="Checklist item">☐ Task</button>
  <button class="fb" data-a="outdent" title="Move left">⇤</button>
  <button class="fb" data-a="indent" title="Move right">⇥</button>
  <div class="fsep"></div>
  <button class="fb" data-a="quote" title="Quote">❝ Quote</button>
  <button class="fb" data-a="link" title="Link">🔗 Link</button>
  <button class="fb" data-a="image" title="Picture from a web address">🖼 Image</button>
  <button class="fb" data-a="table" title="Table">▦ Table</button>
  <button class="fb mono" data-a="code" title="Inline code">`code`</button>
  <button class="fb mono" data-a="codeblock" title="Code block">```</button>
  <button class="fb" data-a="hr" title="Dividing line">— Line</button>
  <button class="fb" data-a="date" title="Insert today's date">📅 Date</button>
  <div class="fsep"></div>
  <button class="fb" data-a="find" title="Find and replace (Ctrl+F)">🔍 Find</button>
</div>

<div class="findbar" id="findbar">
  <input id="findIn" placeholder="Find" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
  <input id="replIn" placeholder="Replace with" autocomplete="off" autocapitalize="off" spellcheck="false">
  <span class="cnt" id="findCnt"></span>
  <button class="fb" id="findPrev" title="Previous">↑</button>
  <button class="fb" id="findNext" title="Next">↓</button>
  <button class="fb" id="replOne">Replace</button>
  <button class="fb" id="replAll">All</button>
  <button class="fb" id="findClose" title="Close">✕</button>
</div>

<main id="main">
  <section class="pane" id="editPane">
    <textarea id="src" spellcheck="true" autocapitalize="sentences" autocomplete="off" placeholder="Start writing Markdown here…"></textarea>
  </section>
  <section class="pane" id="readPane"><article class="md" id="out" spellcheck="true" autocapitalize="sentences"></article></section>
</main>

<footer>
  <span id="status">Ready</span><span class="sp"></span>
  <span id="wc">0 words</span><span id="rt"></span>
</footer>

<input type="file" id="fileIn" hidden>

<div class="scrim" id="scrim"></div>

<div class="sheet menu" id="menu">
  <button data-m="new">📄&nbsp; New document</button>
  <button data-m="saveas">💾&nbsp; Save as…</button>
  <button data-m="copy">📋&nbsp; Copy all Markdown</button>
  <button data-m="copyhtml">🌐&nbsp; Download as web page (.html)</button>
  <button data-m="print">🖨&nbsp; Print or save as PDF (A4)</button>
  <div class="msep"></div>
  <div class="mrow"><span>WYG typing</span><div class="seg" id="lockSeg"><button data-v="off">On</button><button data-v="on">Read only</button></div></div>
  <div class="mrow"><span>Theme</span><div class="seg" id="themeSeg"><button data-v="auto">Auto</button><button data-v="dark">Dark</button><button data-v="light">Light</button></div></div>
  <div class="mrow"><span>Text size</span><div class="seg"><button id="fsDown">A−</button><button id="fsUp">A+</button></div></div>
  <div class="mrow"><span>Reading font</span><div class="seg" id="fontSeg"><button data-v="sans">Plain</button><button data-v="serif">Book</button></div></div>
  <div class="mrow"><span>Editor font</span><div class="seg" id="efontSeg"><button data-v="mono">Code</button><button data-v="sans">Plain</button></div></div>
  <div class="msep"></div>
  <button data-m="help">❔&nbsp; Markdown cheat sheet</button>
</div>

<div class="sheet toc" id="toc"></div>

<div class="sheet dlg" id="dlg">
  <h3 id="dlgTitle"></h3>
